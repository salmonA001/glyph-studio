<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glyph Studio</title>
<style>
:root{--bg:#f3f3f5;--panel:#ffffff;--line:#dedee4;--text:#16161c;--muted:#6b6b78;--accent:#1f9d55;--stage:#e6e6ea;--chip:#f0f0f3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#09090c;--panel:#121217;--line:#24242c;--text:#e9e9ef;--muted:#8b8b98;--accent:#6ee69a;--stage:#050507;--chip:#1b1b22}}
:root[data-theme="dark"]{--bg:#09090c;--panel:#121217;--line:#24242c;--text:#e9e9ef;--muted:#8b8b98;--accent:#6ee69a;--stage:#050507;--chip:#1b1b22}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font:600 15px ui-monospace,Menlo,monospace;margin:0 auto 0 0;letter-spacing:.02em}
header h1 span{color:var(--accent)}
button,.btn{font:inherit;color:var(--text);background:var(--chip);border:1px solid var(--line);border-radius:7px;padding:6px 11px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:#06140b;border-color:var(--accent);font-weight:600}
.drop-hint{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel);opacity:.92;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
button.on{background:var(--accent);color:#06140b;border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
main{flex:1;display:flex;min-height:0}
.stage{flex:1;display:flex;align-items:center;justify-content:center;background:var(--stage);padding:16px;min-width:0;position:relative}
.stage.drag{outline:2px dashed var(--accent);outline-offset:-10px}
.frame{position:relative;display:inline-block;line-height:0;touch-action:none}
.frame canvas{max-width:100%;max-height:calc(100vh - 90px);display:block}
#orig{position:absolute;inset:0;width:100%;height:100%}
#out{position:relative}
.handle{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);display:none;pointer-events:none}
.handle::after{content:"◀ ▶";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--accent);color:#06140b;font:11px/1 ui-monospace,monospace;padding:5px 6px;border-radius:10px;white-space:nowrap}
.comparing .handle{display:block}
aside{width:310px;flex:none;overflow-y:auto;background:var(--panel);border-left:1px solid var(--line);padding:4px 16px 24px}
section{border-bottom:1px solid var(--line);padding:12px 0}
section h2{font:600 11px system-ui;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 9px}
.row{display:grid;grid-template-columns:86px 1fr 38px;align-items:center;gap:8px;margin:7px 0}
.row output{color:var(--muted);text-align:right;font:12px ui-monospace,monospace}
.row.c2{grid-template-columns:86px 1fr}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=text],select{width:100%;font:12px ui-monospace,monospace;background:var(--chip);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 7px}
input[type=color]{width:100%;height:26px;border:1px solid var(--line);border-radius:6px;background:var(--chip);padding:2px}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:5px 9px}
.exports{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#status{margin-top:10px;color:var(--muted);font:12px ui-monospace,monospace;min-height:1.4em;white-space:pre-wrap}
#status.err{color:#e5484d}
[hidden]{display:none!important}
@media (max-width:760px){
  main{flex-direction:column}
  .stage{flex:none;padding:16px}
  .frame canvas{max-height:55vh}
  aside{width:auto;border-left:0;border-top:1px solid var(--line)}
  header{flex-wrap:wrap}
}
</style>
</head>
<body>
<header>
  <h1><span>▚</span> Glyph Studio</h1>
  <button id="upload" class="primary">Upload image or video</button>
  <input id="file" type="file" accept="image/*,video/*" hidden>
  <button id="sample">Sample</button>
  <button id="play" hidden>Pause</button>
  <button id="compare">Compare</button>
</header>
<main>
  <div class="stage" id="stage">
    <div class="frame" id="frame">
      <canvas id="orig"></canvas>
      <canvas id="out"></canvas>
      <div class="handle" id="handle"></div>
    </div>
    <button class="drop-hint" id="dropHint">Drop a picture or video here, or click to choose one</button>
  </div>
  <aside>
    <section>
      <h2>Library</h2>
      <div class="chips" id="presets"></div>
    </section>
    <section>
      <h2>Style</h2>
      <div class="chips" id="modes">
        <button data-mode="ascii">ASCII</button>
        <button data-mode="braille">Braille</button>
        <button data-mode="halftone">Halftone</button>
        <button data-mode="dither">Dither</button>
        <button data-mode="bricks">Bricks</button>
      </div>
      <div class="row"><label>Cell size</label><input type="range" data-k="cell" min="3" max="40" step="1"><output></output></div>
      <div data-modes="ascii">
        <div class="row c2"><label>Charset</label>
          <select id="charsetPreset">
            <option value=" .:-=+*#%@">Standard</option>
            <option value=" .'`^&quot;,:;Il!i><~+_-?][}{1)(|\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&amp;8%B@$">Detailed</option>
            <option value=" ░▒▓█">Blocks</option>
            <option value=" ·•●">Dots</option>
            <option value=" 01">Binary</option>
            <option value="">Custom</option>
          </select></div>
        <div class="row c2"><label>Characters</label><input type="text" data-k="charset" spellcheck="false"></div>
      </div>
      <div data-modes="dither">
        <div class="row c2"><label>Algorithm</label>
          <select data-k="algo"><option value="floyd">Floyd–Steinberg</option><option value="bayer">Ordered (Bayer)</option><option value="atkinson">Atkinson</option></select></div>
      </div>
      <div data-modes="dither,bricks">
        <div class="row"><label>Levels</label><input type="range" data-k="levels" min="2" max="8" step="1"><output></output></div>
      </div>
    </section>
    <section>
      <h2>Tone</h2>
      <div class="row"><label>Brightness</label><input type="range" data-k="brightness" min="-50" max="50" step="1"><output></output></div>
      <div class="row"><label>Contrast</label><input type="range" data-k="contrast" min="-100" max="100" step="1"><output></output></div>
      <div class="row"><label>Gamma</label><input type="range" data-k="gamma" min="0.3" max="3" step="0.05"><output></output></div>
      <div class="row c2"><label>Invert</label><input type="checkbox" data-k="invert"></div>
    </section>
    <section>
      <h2>Color</h2>
      <div class="row c2"><label>Mode</label><select data-k="color"><option value="mono">Two-tone</option><option value="source">Source colors</option></select></div>
      <div class="row c2"><label>Ink</label><input type="color" data-k="fg"></div>
      <div class="row c2"><label>Background</label><input type="color" data-k="bg"></div>
    </section>
    <section>
      <h2>Outline</h2>
      <div class="row c2"><label>Enabled</label><input type="checkbox" data-k="outline"></div>
      <div class="row"><label>Threshold</label><input type="range" data-k="edge" min="0.05" max="1" step="0.01"><output></output></div>
      <div class="row c2"><label>Color</label><input type="color" data-k="outlineColor"></div>
    </section>
    <section>
      <h2>CRT</h2>
      <div class="row"><label>Glow</label><input type="range" data-k="glow" min="0" max="24" step="1"><output></output></div>
      <div class="row c2"><label>Scanlines</label><input type="checkbox" data-k="scanlines"></div>
    </section>
    <section>
      <h2>Export</h2>
      <div class="exports">
        <button id="saveJpg">Save JPEG</button>
        <button id="saveMp4">Record MP4</button>
        <button id="copyText" data-modes="ascii,braille">Copy text</button>
      </div>
      <div id="status"></div>
    </section>
  </aside>
</main>
<script>
const $ = s => document.querySelector(s);
const out = $('#out'), octx = out.getContext('2d');
const orig = $('#orig'), gctx = orig.getContext('2d');
const sampler = document.createElement('canvas'), sctx = sampler.getContext('2d', { willReadFrequently: true });
const glowBuf = document.createElement('canvas'), gbctx = glowBuf.getContext('2d');
const MAX_SIDE = 1600;
const BAYER = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v => (v + 0.5) / 16);
const MONO_FONT = 'ui-monospace, Menlo, Consolas, monospace';

const DEFAULTS = { mode:'ascii', cell:10, charset:' .:-=+*#%@', algo:'floyd', levels:2, brightness:0, contrast:0, gamma:1, invert:false,
  color:'mono', fg:'#e9ffe9', bg:'#08080a', outline:false, edge:0.3, outlineColor:'#ffffff', glow:0, scanlines:false };

const PRESETS = {
  'Terminal':  { mode:'ascii', cell:9, color:'mono', fg:'#5cff8a', bg:'#020a04', glow:10, scanlines:true, contrast:20 },
  'Color ASCII': { mode:'ascii', cell:8, color:'source', bg:'#000000', charset:' .:-=+*#%@', glow:0, scanlines:false },
  'Newsprint': { mode:'halftone', cell:9, color:'mono', fg:'#1a1a1a', bg:'#f2ede1', invert:true, glow:0, scanlines:false },
  'Handheld':  { mode:'dither', cell:4, algo:'bayer', levels:4, color:'mono', fg:'#c4f0c2', bg:'#1f3b2a', glow:0, scanlines:false },
  'Braille':   { mode:'braille', cell:10, color:'mono', fg:'#ffffff', bg:'#0b0b10', glow:4, scanlines:false },
  'Toy bricks':{ mode:'bricks', cell:18, color:'source', levels:5, bg:'#111111', glow:0, scanlines:false },
  'Ink sketch':{ mode:'ascii', cell:8, color:'mono', fg:'#111111', bg:'#fafafa', invert:true, outline:true, edge:0.25, outlineColor:'#111111', charset:' .:-=+*#', contrast:30, glow:0, scanlines:false },
};

const state = { ...DEFAULTS };
let src = null, srcW = 0, srcH = 0, lastText = '', pending = false, recording = false;

// ---------- status ----------
function status(msg, err = false) { const s = $('#status'); s.textContent = msg; s.classList.toggle('err', err); }
window.addEventListener('error', e => status(e.message, true));
window.addEventListener('unhandledrejection', e => status(e.reason.message ?? String(e.reason), true));

// ---------- sampling ----------
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255]; }
function rgbStr(r, g, b) { return `rgb(${r * 255 | 0},${g * 255 | 0},${b * 255 | 0})`; }
function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }

// Draws the source into a w×h grid and returns tone-adjusted channels in 0..1.
function sample(w, h) {
  sampler.width = w; sampler.height = h;
  sctx.imageSmoothingQuality = 'high';
  sctx.drawImage(src, 0, 0, w, h);
  const d = sctx.getImageData(0, 0, w, h).data;
  const n = w * h, r = new Float32Array(n), g = new Float32Array(n), b = new Float32Array(n), l = new Float32Array(n);
  const br = state.brightness / 100, c = state.contrast, cf = c >= 0 ? 1 + c / 25 : 1 + c / 100, ig = 1 / state.gamma;
  const adj = v => { v = (v + br - 0.5) * cf + 0.5; v = v < 0 ? 0 : v > 1 ? 1 : v; v = Math.pow(v, ig); return state.invert ? 1 - v : v; };
  for (let i = 0; i < n; i++) {
    r[i] = adj(d[i * 4] / 255); g[i] = adj(d[i * 4 + 1] / 255); b[i] = adj(d[i * 4 + 2] / 255);
    l[i] = 0.2126 * r[i] + 0.7152 * g[i] + 0.0722 * b[i];
  }
  return { w, h, r, g, b, l };
}

// Sobel magnitude (normalised) and angle per grid cell.
function edges(l, w, h) {
  const mag = new Float32Array(w * h), ang = new Float32Array(w * h);
  const at = (x, y) => l[Math.min(h - 1, Math.max(0, y)) * w + Math.min(w - 1, Math.max(0, x))];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const gx = -at(x-1,y-1) - 2*at(x-1,y) - at(x-1,y+1) + at(x+1,y-1) + 2*at(x+1,y) + at(x+1,y+1);
    const gy = -at(x-1,y-1) - 2*at(x,y-1) - at(x+1,y-1) + at(x-1,y+1) + 2*at(x,y+1) + at(x+1,y+1);
    mag[y * w + x] = Math.hypot(gx, gy) / 4;
    ang[y * w + x] = Math.atan2(gy, gx);
  }
  return { mag, ang };
}

// In-place quantisation of one 0..1 channel to `levels` steps.
function dither(a, w, h, levels, algo) {
  const L = levels - 1;
  if (algo === 'bayer') {
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x, v = a[i] * L, base = Math.floor(v);
      a[i] = Math.min(L, base + (v - base > BAYER[(y & 3) * 4 + (x & 3)] ? 1 : 0)) / L;
    }
    return;
  }
  const kernel = algo === 'floyd'
    ? [[1,0,7/16],[-1,1,3/16],[0,1,5/16],[1,1,1/16]]
    : [[1,0,1/8],[2,0,1/8],[-1,1,1/8],[0,1,1/8],[1,1,1/8],[0,2,1/8]];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x, old = a[i], q = Math.round(Math.min(1, Math.max(0, old)) * L) / L;
    a[i] = q;
    const err = old - q;
    for (const [dx, dy, k] of kernel) {
      const nx = x + dx, ny = y + dy;
      if (nx >= 0 && nx < w && ny < h) a[ny * w + nx] += err * k;
    }
  }
}
function quantize(a, levels) { const L = levels - 1; for (let i = 0; i < a.length; i++) a[i] = Math.round(a[i] * L) / L; }

// ---------- renderers ----------
function cellColor(s, i, fg) { return state.color === 'source' ? rgbStr(s.r[i], s.g[i], s.b[i]) : fg; }

function renderAscii(W, H) {
  const chars = [...state.charset];
  if (chars.length < 2) throw new Error('Charset needs at least 2 characters');
  const ch = state.cell, cw = ch * 0.6, cols = Math.floor(W / cw), rows = Math.floor(H / ch);
  const s = sample(cols, rows), e = state.outline ? edges(s.l, cols, rows) : null;
  const fg = state.fg, n = chars.length - 1, lines = [];
  octx.font = `${ch}px ${MONO_FONT}`; octx.textAlign = 'center'; octx.textBaseline = 'middle';
  const ox = (W - cols * cw) / 2, oy = (H - rows * ch) / 2;
  for (let y = 0; y < rows; y++) {
    let line = '';
    for (let x = 0; x < cols; x++) {
      const i = y * cols + x;
      let c = chars[Math.round(s.l[i] * n)], color = cellColor(s, i, fg);
      if (e && e.mag[i] > state.edge) { c = edgeChar(e.ang[i]); color = state.outlineColor; }
      line += c;
      if (c === ' ') continue;
      octx.fillStyle = color;
      octx.fillText(c, ox + x * cw + cw / 2, oy + y * ch + ch / 2);
    }
    lines.push(line.trimEnd());
  }
  lastText = lines.join('\n');
}
// Gradient points across the edge; the stroke runs perpendicular to it.
function edgeChar(a) {
  const t = ((a + Math.PI / 2) % Math.PI + Math.PI) % Math.PI, k = Math.round(t / (Math.PI / 4)) % 4;
  return ['-', '\\', '|', '/'][k];
}

function renderBraille(W, H) {
  const p = state.cell / 4, cols = Math.floor(W / (2 * p)), rows = Math.floor(H / (4 * p)), dw = cols * 2, dh = rows * 4;
  const s = sample(dw, dh), e = state.outline ? edges(s.l, dw, dh) : null;
  const on = new Float32Array(s.l); dither(on, dw, dh, 2, 'bayer');
  const BIT = [[0x01, 0x08], [0x02, 0x10], [0x04, 0x20], [0x40, 0x80]];
  const ox = (W - dw * p) / 2, oy = (H - dh * p) / 2, rad = p * 0.4, lines = [];
  for (let cy = 0; cy < rows; cy++) {
    let line = '';
    for (let cx = 0; cx < cols; cx++) {
      let code = 0;
      for (let dy = 0; dy < 4; dy++) for (let dx = 0; dx < 2; dx++) {
        const x = cx * 2 + dx, y = cy * 4 + dy, i = y * dw + x, isEdge = e && e.mag[i] > state.edge;
        if (!isEdge && on[i] < 0.5) continue;
        code |= BIT[dy][dx];
        octx.fillStyle = isEdge ? state.outlineColor : cellColor(s, i, state.fg);
        octx.beginPath(); octx.arc(ox + x * p + p / 2, oy + y * p + p / 2, rad, 0, Math.PI * 2); octx.fill();
      }
      line += String.fromCharCode(0x2800 + code);
    }
    lines.push(line);
  }
  lastText = lines.join('\n');
}

function renderHalftone(W, H) {
  const c = state.cell, cols = Math.floor(W / c), rows = Math.floor(H / c);
  const s = sample(cols, rows), e = state.outline ? edges(s.l, cols, rows) : null;
  const ox = (W - cols * c) / 2, oy = (H - rows * c) / 2;
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const i = y * cols + x, isEdge = e && e.mag[i] > state.edge;
    const r = isEdge ? c * 0.5 : c * 0.62 * Math.sqrt(s.l[i]);
    if (r < 0.3) continue;
    octx.fillStyle = isEdge ? state.outlineColor : cellColor(s, i, state.fg);
    octx.beginPath(); octx.arc(ox + x * c + c / 2, oy + y * c + c / 2, r, 0, Math.PI * 2); octx.fill();
  }
  lastText = '';
}

function renderDither(W, H) {
  const c = state.cell, cols = Math.floor(W / c), rows = Math.floor(H / c);
  const s = sample(cols, rows), e = state.outline ? edges(s.l, cols, rows) : null;
  const fg = hexRgb(state.fg), bg = hexRgb(state.bg), src = state.color === 'source';
  if (src) for (const ch of [s.r, s.g, s.b]) dither(ch, cols, rows, state.levels, state.algo);
  else dither(s.l, cols, rows, state.levels, state.algo);
  const ox = (W - cols * c) / 2, oy = (H - rows * c) / 2;
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const i = y * cols + x;
    octx.fillStyle = e && e.mag[i] > state.edge ? state.outlineColor
      : src ? rgbStr(s.r[i], s.g[i], s.b[i]) : rgbStr(...mix(bg, fg, s.l[i]));
    octx.fillRect(ox + x * c, oy + y * c, c, c);
  }
  lastText = '';
}

function renderBricks(W, H) {
  const c = state.cell, cols = Math.floor(W / c), rows = Math.floor(H / c);
  const s = sample(cols, rows), e = state.outline ? edges(s.l, cols, rows) : null;
  const fg = hexRgb(state.fg), bg = hexRgb(state.bg), src = state.color === 'source';
  if (src) for (const ch of [s.r, s.g, s.b]) quantize(ch, state.levels); else quantize(s.l, state.levels);
  const ox = (W - cols * c) / 2, oy = (H - rows * c) / 2, b = Math.max(1, c * 0.08);
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const i = y * cols + x, px = ox + x * c, py = oy + y * c;
    const color = e && e.mag[i] > state.edge ? state.outlineColor : src ? rgbStr(s.r[i], s.g[i], s.b[i]) : rgbStr(...mix(bg, fg, s.l[i]));
    octx.fillStyle = color; octx.fillRect(px, py, c, c);
    octx.fillStyle = 'rgba(255,255,255,.18)'; octx.fillRect(px, py, c, b); octx.fillRect(px, py, b, c);
    octx.fillStyle = 'rgba(0,0,0,.35)'; octx.fillRect(px, py + c - b, c, b); octx.fillRect(px + c - b, py, b, c);
    const cx = px + c / 2, cy = py + c / 2, r = c * 0.3;
    octx.fillStyle = 'rgba(0,0,0,.3)'; octx.beginPath(); octx.arc(cx + b * 0.7, cy + b * 0.7, r, 0, 7); octx.fill();
    octx.fillStyle = color; octx.beginPath(); octx.arc(cx, cy, r, 0, 7); octx.fill();
    octx.strokeStyle = 'rgba(255,255,255,.3)'; octx.lineWidth = b * 0.8;
    octx.beginPath(); octx.arc(cx, cy, r * 0.75, Math.PI * 1.05, Math.PI * 1.55); octx.stroke();
  }
  lastText = '';
}

const RENDERERS = { ascii: renderAscii, braille: renderBraille, halftone: renderHalftone, dither: renderDither, bricks: renderBricks };

function crt(W, H) {
  if (state.glow > 0) {
    glowBuf.width = W; glowBuf.height = H; gbctx.drawImage(out, 0, 0);
    octx.save(); octx.filter = `blur(${state.glow}px)`; octx.globalCompositeOperation = 'lighter'; octx.globalAlpha = 0.85;
    octx.drawImage(glowBuf, 0, 0); octx.restore();
  }
  if (state.scanlines) {
    octx.fillStyle = 'rgba(0,0,0,.28)';
    for (let y = 0; y < H; y += 3) octx.fillRect(0, y, W, 1);
  }
}

function render() {
  pending = false;
  const k = Math.min(1, MAX_SIDE / Math.max(srcW, srcH)), W = Math.round(srcW * k), H = Math.round(srcH * k);
  if (out.width !== W || out.height !== H) { out.width = orig.width = W; out.height = orig.height = H; }
  gctx.drawImage(src, 0, 0, W, H);
  octx.fillStyle = state.bg; octx.fillRect(0, 0, W, H);
  RENDERERS[state.mode](W, H);
  crt(W, H);
}
function scheduleRender() {
  if (pending || isPlaying()) return;
  pending = true; requestAnimationFrame(render);
}
const isPlaying = () => src instanceof HTMLVideoElement && !src.paused;
function videoLoop() { if (!isPlaying()) return; render(); requestAnimationFrame(videoLoop); }

// ---------- sources ----------
function setSource(el, w, h) {
  if (src instanceof HTMLVideoElement) { src.pause(); URL.revokeObjectURL(src.src); }
  src = el; srcW = w; srcH = h;
  const video = el instanceof HTMLVideoElement;
  $('#play').hidden = !video; $('#saveMp4').disabled = !video;
  if (video) { el.addEventListener('play', () => { $('#play').textContent = 'Pause'; videoLoop(); }); el.addEventListener('pause', () => $('#play').textContent = 'Play'); el.play(); }
  render();
}

async function loadFile(file) {
  const url = URL.createObjectURL(file);
  if (file.type.startsWith('image/')) {
    const img = new Image(); img.src = url; await img.decode();
    setSource(img, img.naturalWidth, img.naturalHeight);
    status(`${file.name} · ${img.naturalWidth}×${img.naturalHeight}`);
  } else if (file.type.startsWith('video/')) {
    const v = document.createElement('video');
    Object.assign(v, { src: url, muted: true, loop: true, playsInline: true });
    await new Promise((res, rej) => { v.onloadeddata = res; v.onerror = () => rej(new Error('Could not decode this video')); });
    setSource(v, v.videoWidth, v.videoHeight);
    status(`${file.name} · ${v.videoWidth}×${v.videoHeight} · ${v.duration.toFixed(1)}s`);
  } else throw new Error(`Unsupported file type: ${file.type || 'unknown'}`);
}

function makeSample() {
  const c = document.createElement('canvas'), W = 1200, H = 800; c.width = W; c.height = H;
  const x = c.getContext('2d');
  const sky = x.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#1d2b64'); sky.addColorStop(0.6, '#f8a978'); sky.addColorStop(1, '#2b1a2f');
  x.fillStyle = sky; x.fillRect(0, 0, W, H);
  const sun = x.createRadialGradient(820, 300, 10, 820, 300, 200); sun.addColorStop(0, '#fff6d5'); sun.addColorStop(0.5, '#ffb347'); sun.addColorStop(1, 'rgba(255,120,60,0)');
  x.fillStyle = sun; x.fillRect(0, 0, W, H);
  x.fillStyle = '#2a1636';
  x.beginPath(); x.moveTo(0, 620); x.lineTo(220, 420); x.lineTo(380, 560); x.lineTo(560, 380); x.lineTo(760, 600); x.lineTo(960, 470); x.lineTo(W, 580); x.lineTo(W, H); x.lineTo(0, H); x.fill();
  const ball = x.createRadialGradient(300, 560, 20, 340, 600, 170); ball.addColorStop(0, '#ffffff'); ball.addColorStop(0.3, '#7fd3ff'); ball.addColorStop(1, '#0b2341');
  x.fillStyle = ball; x.beginPath(); x.arc(340, 610, 150, 0, Math.PI * 2); x.fill();
  x.fillStyle = '#ffffff'; x.font = 'bold 150px system-ui, sans-serif'; x.textAlign = 'center'; x.fillText('GLYPH', 760, 200);
  setSource(c, W, H);
  status('Sample image · drop your own image or video anywhere');
}

// ---------- controls ----------
const inputs = [...document.querySelectorAll('[data-k]')];
function syncInputs() {
  for (const el of inputs) {
    const v = state[el.dataset.k];
    if (el.type === 'checkbox') el.checked = v; else el.value = v;
    const o = el.parentElement.querySelector('output'); if (o) o.textContent = v;
  }
  const preset = [...$('#charsetPreset').options].find(o => o.value === state.charset);
  $('#charsetPreset').value = preset ? preset.value : '';
  for (const b of document.querySelectorAll('#modes button')) b.classList.toggle('on', b.dataset.mode === state.mode);
  for (const el of document.querySelectorAll('[data-modes]')) el.hidden = !el.dataset.modes.split(',').includes(state.mode);
}
for (const el of inputs) el.addEventListener('input', () => {
  state[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.type === 'range' ? parseFloat(el.value) : el.value;
  syncInputs(); scheduleRender();
});
$('#charsetPreset').addEventListener('change', e => { if (e.target.value) { state.charset = e.target.value; syncInputs(); scheduleRender(); } });
$('#modes').addEventListener('click', e => { const m = e.target.dataset.mode; if (m) { state.mode = m; syncInputs(); scheduleRender(); } });
for (const [name, p] of Object.entries(PRESETS)) {
  const b = document.createElement('button'); b.textContent = name;
  b.onclick = () => { Object.assign(state, DEFAULTS, p); syncInputs(); scheduleRender(); };
  $('#presets').append(b);
}

$('#upload').onclick = $('#dropHint').onclick = () => $('#file').click();
$('#file').addEventListener('change', e => { const f = e.target.files[0]; if (f) loadFile(f); e.target.value = ''; });
$('#sample').onclick = makeSample;
$('#play').onclick = () => src.paused ? src.play() : src.pause();
const stage = $('#stage');
stage.addEventListener('dragover', e => { e.preventDefault(); stage.classList.add('drag'); });
stage.addEventListener('dragleave', () => stage.classList.remove('drag'));
stage.addEventListener('drop', e => { e.preventDefault(); stage.classList.remove('drag'); const f = e.dataTransfer.files[0]; if (f) loadFile(f); });

// compare slider: original shows on the left of the handle
const frame = $('#frame');
function setSplit(pct) { out.style.clipPath = `inset(0 0 0 ${pct}%)`; $('#handle').style.left = `calc(${pct}% - 1px)`; }
$('#compare').onclick = () => {
  const on = frame.classList.toggle('comparing'); $('#compare').classList.toggle('on', on);
  setSplit(on ? 50 : 0); out.style.clipPath = on ? out.style.clipPath : '';
};
frame.addEventListener('pointerdown', e => { if (frame.classList.contains('comparing')) { frame.setPointerCapture(e.pointerId); moveSplit(e); } });
frame.addEventListener('pointermove', e => { if (frame.hasPointerCapture(e.pointerId)) moveSplit(e); });
function moveSplit(e) { const r = frame.getBoundingClientRect(); setSplit(Math.min(100, Math.max(0, (e.clientX - r.left) / r.width * 100))); }

// ---------- export ----------
function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
$('#saveJpg').onclick = () => { render(); out.toBlob(b => download(b, `glyph-${state.mode}.jpg`), 'image/jpeg', 0.92); };
$('#copyText').onclick = async () => { await navigator.clipboard.writeText(lastText); status(`Copied ${lastText.split('\n').length} lines of text`); };
$('#saveMp4').onclick = async () => {
  if (recording) return;
  const type = 'video/mp4';
  if (!MediaRecorder.isTypeSupported(type)) throw new Error('This browser cannot record MP4 (try Chrome, Edge or Safari)');
  recording = true; $('#saveMp4').disabled = true;
  const v = src, chunks = [];
  v.pause(); v.loop = false; v.currentTime = 0;
  await new Promise(r => v.addEventListener('seeked', r, { once: true }));
  const rec = new MediaRecorder(out.captureStream(30), { mimeType: type, videoBitsPerSecond: 8e6 });
  rec.ondataavailable = e => chunks.push(e.data);
  const done = new Promise(r => rec.onstop = r);
  rec.start(); status('Recording… plays the video once');
  v.addEventListener('ended', () => rec.stop(), { once: true });
  await v.play();
  await done;
  download(new Blob(chunks, { type }), `glyph-${state.mode}.mp4`);
  v.loop = true; v.play(); recording = false; $('#saveMp4').disabled = false; status('Saved MP4');
};

syncInputs();
makeSample();
</script>
</body>
</html>
